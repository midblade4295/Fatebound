name: Promote approved Fatebound v108

on:
  push:
    branches:
      - chore/promote-v108-season-pass
    paths:
      - patches/v108/**
      - .github/workflows/promote-approved-v108.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-approved-v108
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/chore/promote-v108-season-pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact approved source and check every inline script
        run: python3 patches/v108/promote.py
      - name: Verify checksum before commit
        run: |
          set -euo pipefail
          sha256sum -c fatebound-source.sha256
          test "$(git hash-object fatebound.html)" = '50f2d0a8bfb7fda523409aa224ff2351386609ad'
          test "$(wc -c < fatebound.html)" -eq 36175422
      - name: Commit source and provenance without force-pushing
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fatebound.html fatebound-source.json fatebound-source.sha256 docs/fatebound-v108-season-pass-test-report.md docs/v108-import-verification.json
          git diff --cached --quiet || git commit -m 'Promote exact approved Fatebound v108 as current full source'
          git push origin HEAD:chore/promote-v108-season-pass
      - name: Record verification result
        run: |
          cat docs/v108-import-verification.json >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"
