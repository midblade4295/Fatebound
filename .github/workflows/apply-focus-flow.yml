name: Apply focus flow

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/apply_focus_flow.py"
      - ".github/workflows/apply-focus-flow.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/focus-flow
          fetch-depth: 0
      - name: Apply
        run: |
          set -euo pipefail
          python3 patches/apply_focus_flow.py
          grep -q focusFlowLayout fatebound.html
          grep -q pairFocusTick fatebound.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fatebound.html
          git diff --cached --quiet || git commit -m "Regen Focus in combat; lock battle to one screen"
          git push origin HEAD:grok/focus-flow
