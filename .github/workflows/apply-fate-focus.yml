name: Apply Fate/Focus patch

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/fate-focus.patch"
      - ".github/workflows/apply-fate-focus.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/fate-focus
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -euo pipefail
          if grep -q 'function focus()' fatebound.html && grep -q '__fateFocus' fatebound.html; then
            echo already applied
            exit 0
          fi
          patch -p0 --forward < patches/fate-focus.patch
          grep -q 'function focus()' fatebound.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fatebound.html
          git commit -m "Split Fate tickets from match Focus"
          git push origin HEAD:grok/fate-focus
