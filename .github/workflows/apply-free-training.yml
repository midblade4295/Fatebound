name: Make training free

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/free-training.patch"
      - ".github/workflows/apply-free-training.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/fate-focus
          fetch-depth: 0
      - name: Remove training Fate cost
        run: |
          set -euo pipefail
          if ! grep -q "Need 1 Fate to train" fatebound.html; then
            echo already free
            exit 0
          fi
          patch -p0 --forward < patches/free-training.patch
          if grep -q "Need 1 Fate to train" fatebound.html; then
            echo patch failed
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fatebound.html
          git commit -m "Make academy training free"
          git push origin HEAD:grok/fate-focus
