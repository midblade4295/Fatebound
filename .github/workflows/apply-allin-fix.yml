name: Apply allin fix

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/apply_allin_fix.py"
      - ".github/workflows/apply-allin-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/allin-fix
          fetch-depth: 0
      - name: Apply
        run: |
          set -euo pipefail
          python3 patches/apply_allin_fix.py
          grep -q allInSafeMult fatebound.html
          grep -q giftNoJank fatebound.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fatebound.html
          git diff --cached --quiet || git commit -m "Fix All-in crash; pin gifts so they do not shove the layout"
          git push origin HEAD:grok/allin-fix
