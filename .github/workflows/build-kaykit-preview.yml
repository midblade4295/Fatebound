name: Build Fatebound KayKit 3D preview APK

# Builds the separate "Fatebound 3D Preview" package (com.fatebound.kaykitrebuild).
# It installs alongside production and the other previews and never touches their saves.
on:
  push:
    branches:
      - claude/kaykit-3d-rebuild
    paths:
      - "godot/**"
      - ".github/workflows/build-kaykit-preview.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/build-kaykit-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaykit-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install Godot 4.7.2 and Android export templates
        run: |
          set -euo pipefail
          mkdir -p /tmp/fatebound-godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl --fail --location --retry 3 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/fatebound-godot/editor.zip
          unzip -q /tmp/fatebound-godot/editor.zip -d /tmp/fatebound-godot
          curl --fail --location --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/fatebound-godot/templates.tpz
          unzip -j -q /tmp/fatebound-godot/templates.tpz "templates/android_*" "templates/version.txt" -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          chmod +x /tmp/fatebound-godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT=/tmp/fatebound-godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path="%s"\nexport/android/android_sdk_path="%s"\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Build, verify, and sign with a throwaway preview key
        run: |
          set -euo pipefail
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 9999 -alias fbpreview \
            -keypass fbpreview -storepass fbpreview -dname "CN=Fatebound 3D Preview (CI debug), O=Fatebound" \
            -keystore "$RUNNER_TEMP/preview.jks" -noprompt
          GODOT="$GODOT" KEYSTORE="$RUNNER_TEMP/preview.jks" KS_ALIAS=fbpreview \
            KS_PASS=fbpreview godot/tools/build_siege_preview.sh \
            "$PWD/godot/build/Fatebound-3D-Preview-arm64.apk"
      - name: Verify package and signature
        run: |
          set -euo pipefail
          APK=godot/build/Fatebound-3D-Preview-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee godot/build/badging.txt
          grep -q "package: name='com.fatebound.kaykitrebuild'" godot/build/badging.txt
          grep -q "native-code: 'arm64-v8a'" godot/build/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fatebound-3d-preview-apk
          path: |
            godot/build/Fatebound-3D-Preview-arm64.apk
            godot/build/Fatebound-3D-Preview-arm64.apk.sha256
            godot/build/badging.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
