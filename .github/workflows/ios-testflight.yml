name: iOS TestFlight

# Fatebound for iPhone (godot/IOS_PORT_SPEC_FOR_CLAUDE.md section 8; how to set it up: godot/IOS_HANDOFF.md).
# Started by hand only (Actions > iOS TestFlight > Run workflow) -- never on push. It builds the branch you name on
# GitHub's Mac and, in "testflight" mode, uploads the .ipa to App Store Connect for TestFlight. It never submits
# anything for App Store review and never releases: Kevin decides that in App Store Connect.
#   testflight        Godot export -> signed archive -> .ipa -> checks -> TestFlight upload (needs the secrets below)
#   simulator-check   the same project built for the iOS Simulator, unsigned: proves it compiles and links (no secrets)
# Secrets (names only; the values live in GitHub > Settings > Secrets and never in git, logs or chat):
#   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD   the Apple Distribution certificate + its private key (.p12)
#   IOS_PROVISIONING_PROFILE_BASE64                   the App Store provisioning profile for com.fatebound.game
#   IOS_KEYCHAIN_PASSWORD                             any password, for the throwaway keychain on the runner
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8_BASE64   an App Store Connect API key (App Manager) for the upload

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "claude/siege-dev-r6-local"
      version_name:
        description: "App Store version (CFBundleShortVersionString): the Play versionName's number, e.g. 1.2.26"
        required: true
      version_code:
        description: "Build number (CFBundleVersion): the Play versionCode, e.g. 216 -- must only go up"
        required: true
      mode:
        description: "testflight = sign and upload; simulator-check = build for the Simulator only (no secrets)"
        type: choice
        options: [testflight, simulator-check]
        default: testflight

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      GODOT_VERSION: "4.7.2-stable"
      # SHA-512 from godotengine/godot's own SHA512-SUMS.txt for 4.7.2-stable
      GODOT_MAC_SHA512: "38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca"
      GODOT_TPZ_SHA512: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"
      TEAM_ID: "YBKRZRW845"
      BUNDLE_ID: "com.fatebound.game"
      OUT: "godot/build/ios"
    steps:
      - name: Check the inputs
        env:
          VNAME: ${{ inputs.version_name }}
          VCODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$VNAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "version_name must be like 1.2.26"; exit 1; }
          [[ "$VCODE" =~ ^[0-9]+$ ]] || { echo "version_code must be a number"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Godot 4.7.2 (editor and iOS export template, SHA-512 checked)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          curl -fsSL --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}_macos.universal.zip"
          echo "$GODOT_MAC_SHA512  godot.zip" | shasum -a 512 -c -
          unzip -q godot.zip
          curl -fsSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "$GODOT_TPZ_SHA512  templates.tpz" | shasum -a 512 -c -
          unzip -q templates.tpz "templates/ios.zip" "templates/version.txt" -d tpl
          tdir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$tdir"
          cp tpl/templates/ios.zip tpl/templates/version.txt "$tdir/"
          rm -f godot.zip templates.tpz
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" --version

      - name: iOS plugins (GodotApplePlugins pinned and checked; FateboundNotifyIOS built from source)
        run: bash godot/tools/ios_plugins.sh

      - name: Version and export settings (this run only; nothing is committed)
        env:
          VNAME: ${{ inputs.version_name }}
          VCODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          path = "godot/export_presets.cfg"
          s = open(path).read()
          blocks = re.split(r"(?m)^(?=\[preset\.\d+(?:\.options)?\]\s*$)", s)
          idx = [i for i, b in enumerate(blocks) if re.search(r'(?m)^name="iOS App Store"$', b)]
          assert len(idx) == 1, "no iOS App Store preset"
          i = idx[0] + 1                      # its [preset.N.options] block follows
          assert blocks[i].startswith("[preset.") and ".options]" in blocks[i].splitlines()[0]
          def put(key, value):
              global blocks
              blocks[i], n = re.subn(r"(?m)^%s=.*$" % re.escape(key), "%s=%s" % (key, value), blocks[i], count=1)
              assert n == 1, key
          put("application/short_version", '"%s"' % os.environ["VNAME"])
          put("application/version", '"%s"' % os.environ["VCODE"])
          put("application/export_project_only", "true")      # Godot writes the Xcode project; xcodebuild signs below
          open(path, "w").write("".join(blocks))
          PY
          grep -n "short_version\|^application/version\|export_project_only" godot/export_presets.cfg

      - name: Import
        run: |
          set -euo pipefail
          "$GODOT" --headless --path godot --import > "$RUNNER_TEMP/import.log" 2>&1 || true
          tail -5 "$RUNNER_TEMP/import.log"
          grep -q "GodotApplePluginsStoreKit" godot/.godot/extension_list.cfg
          grep -q "GodotApplePluginsGameCenter" godot/.godot/extension_list.cfg
          grep -q "FateboundNotifyIOS" godot/.godot/extension_list.cfg

      - name: Export the Xcode project
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          "$GODOT" --headless --path godot --export-release "iOS App Store" "$PWD/$OUT/Fatebound.ipa" 2>&1 | tee "$RUNNER_TEMP/export.log"
          test -d "$OUT/Fatebound.xcodeproj"
          test -f "$OUT/Fatebound.pck"
          ls "$OUT/Fatebound/dylibs/addons" "$OUT"

      - name: Checks (base pck, privacy manifest, bundle id, version, plugins)
        env:
          VNAME: ${{ inputs.version_name }}
          VCODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          python3 godot/tools/content_packs.py base "$OUT/Fatebound.pck"
          plutil -lint "$OUT/PrivacyInfo.xcprivacy" "$OUT/Fatebound/Fatebound-Info.plist" "$OUT/Fatebound/Fatebound.entitlements"
          pbx="$OUT/Fatebound.xcodeproj/project.pbxproj"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$pbx"
          grep -q "MARKETING_VERSION = $VNAME;" "$pbx"
          grep -q "CURRENT_PROJECT_VERSION = $VCODE;" "$pbx"
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 17.0;" "$pbx"
          grep -q "com.apple.developer.game-center" "$OUT/Fatebound/Fatebound.entitlements"
          for sym in godot_apple_plugins_storekit_start godot_apple_plugins_game_center_start fatebound_notify_ios_init; do
            grep -rq "$sym" "$OUT/Fatebound" || { echo "missing $sym"; exit 1; }
          done

      - name: Build for the iOS Simulator (unsigned)
        if: inputs.mode == 'simulator-check'
        run: |
          set -euo pipefail
          xcodebuild -project "$OUT/Fatebound.xcodeproj" -scheme Fatebound -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          app="$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)"
          ditto -c -k --keepParent "$app" "$OUT/Fatebound-simulator.app.zip"

      - name: Signing (a throwaway keychain; the certificate and profile from secrets)
        if: inputs.mode == 'testflight'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for v in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_KEYCHAIN_PASSWORD; do
            [ -n "${!v}" ] || { echo "secret $v is not set (see godot/IOS_HANDOFF.md)"; exit 1; }
          done
          kc="$RUNNER_TEMP/fatebound.keychain-db"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$kc"
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q "Apple Distribution" || { echo "no Apple Distribution identity in the .p12"; exit 1; }
          prof="$RUNNER_TEMP/fatebound.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$prof"
          security cms -D -i "$prof" > "$RUNNER_TEMP/profile.plist"
          uuid="$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")"
          name="$(plutil -extract Name raw -o - "$RUNNER_TEMP/profile.plist")"
          appid="$(plutil -extract Entitlements.application-identifier raw -o - "$RUNNER_TEMP/profile.plist")"
          [ "$appid" = "$TEAM_ID.$BUNDLE_ID" ] || { echo "the profile is for $appid, not $TEAM_ID.$BUNDLE_ID"; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$prof" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          rm -f "$prof" "$RUNNER_TEMP/profile.plist"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

      - name: Archive and export the .ipa
        if: inputs.mode == 'testflight'
        run: |
          set -euo pipefail
          xcodebuild -project "$OUT/Fatebound.xcodeproj" -scheme Fatebound -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Fatebound.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Fatebound.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$OUT/ipa" | tail -20
          ipa="$(ls "$OUT"/ipa/*.ipa | head -1)"
          mv "$ipa" "$OUT/Fatebound.ipa"
          python3 godot/tools/content_packs.py base "$OUT/Fatebound.ipa"
          unzip -l "$OUT/Fatebound.ipa" | grep -q "Payload/.*\.app/PrivacyInfo.xcprivacy"
          ls -la "$OUT/Fatebound.ipa"

      - name: Upload to TestFlight (never submitted for review)
        if: inputs.mode == 'testflight'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for v in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            [ -n "${!v}" ] || { echo "secret $v is not set (see godot/IOS_HANDOFF.md)"; exit 1; }
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --validate-app --type ios --file "$OUT/Fatebound.ipa" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$OUT/Fatebound.ipa" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          echo "Uploaded. App Store Connect > TestFlight shows the build once Apple has processed it (usually 10-30 minutes)."

      - name: Keep the build (the .ipa / Simulator app and logs -- never the secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatebound-ios-${{ inputs.version_code }}-${{ inputs.mode }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            godot/build/ios/Fatebound.ipa
            godot/build/ios/Fatebound-simulator.app.zip
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/export.log

      - name: Clean up the keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/fatebound.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/profile.plist 2>/dev/null || true
