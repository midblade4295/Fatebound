name: Build Play Store AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "fatebound.html"
      - "legionary-client.js"
      - ".github/workflows/build-aab.yml"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use runner Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          SM=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Copy game and Legionary client into assets
        run: |
          mkdir -p android/app/src/main/assets
          cp fatebound.html android/app/src/main/assets/index.html
          if [ -f legionary-client.js ]; then
            cp legionary-client.js android/app/src/main/assets/legionary-client.js
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/assets/index.html")
          t = p.read_text(encoding="utf-8", errors="replace")
          tag = '<script src="legionary-client.js"></script>\n'
          if Path("android/app/src/main/assets/legionary-client.js").exists() and "legionary-client.js" not in t:
              t = t.replace("</body>", tag + "</body>", 1)
              p.write_text(t, encoding="utf-8")
          PY

      - name: Restore Play upload keystore
        run: |
          base64 -d android/keystore/upload.jks.b64 > /tmp/upload.jks
          keytool -list -keystore /tmp/upload.jks -storepass FateboundUpload26
          echo "SIGNING_KEYSTORE=/tmp/upload.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=FateboundUpload26" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=upload" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=FateboundUpload26" >> "$GITHUB_ENV"

      - name: Build release AAB
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fatebound-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
